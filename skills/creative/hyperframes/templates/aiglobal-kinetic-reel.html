<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 1280px; overflow: hidden; background: #000; font-family: 'DejaVu Sans', sans-serif; }
      .scene { position: absolute; inset: 0; width: 720px; height: 1280px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px; }
      #s1 { background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 70%); }
      .logo-text { font-size: 72px; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; }
      .logo-ai { color: #D7AB46; }
      .logo-global { color: #fff; }
      .tagline { font-size: 22px; font-weight: 200; color: rgba(255,255,255,0.5); letter-spacing: 4px; margin-top: 20px; }
      #s2 { background: #000; }
      .kw1 { font-size: 80px; font-weight: 900; color: #D7AB46; position: absolute; top:30%; left:10%; }
      .kw2 { font-size: 64px; font-weight: 200; color: #fff; position: absolute; top:30%; left:35%; }
      .kw3 { font-size: 80px; font-weight: 900; color: #D7AB46; position: absolute; top:45%; left:50%; }
      .kw4 { font-size: 64px; font-weight: 200; color: #fff; position: absolute; top:55%; left:15%; }
      .kw5 { font-size: 80px; font-weight: 900; color: #D7AB46; position: absolute; top:55%; left:40%; }
      .kw6 { font-size: 64px; font-weight: 200; color: #fff; position: absolute; top:70%; left:25%; }
      #s3 { background: radial-gradient(ellipse at center, #D7AB46 0%, #000 60%); }
      .big-text { font-size: 68px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; }
      .s3-accent { font-size: 36px; font-weight: 200; color: #D7AB46; text-align: center; margin-top: 30px; letter-spacing: 3px; }
      #s4 { background: #000; }
      .ai-icon { font-size: 120px; margin-bottom: 40px; display: block; }
      .cta-text { font-size: 44px; font-weight: 700; color: #fff; text-align: center; line-height: 1.4; }
      .s4-accent { font-size: 28px; font-weight: 200; color: #D7AB46; margin-top: 20px; letter-spacing: 2px; }
      .divider { width: 80px; height: 3px; background: #D7AB46; margin: 25px auto; }
    </style>
  </head>
  <body>
    <audio data-audio-id="bgm" preload="auto" src="assets/bg_music.mp3" data-start="0" data-duration="15"></audio>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="720" data-height="1280">
      <div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="logo-text"><span class="logo-ai">AI</span> <span class="logo-global">GLOBAL</span></div>
        <div class="divider s1-d"></div>
        <div class="tagline">21-Р ЗУУНЫ СУПЕР ХҮНИЙГ БЭЛДЭНЭ</div>
      </div>
      <div id="s2" class="scene clip" data-start="4" data-duration="3.5" data-track-index="2">
        <span class="kw1">AI</span><span class="kw2">ВИБЕ</span><span class="kw3">КОД</span>
        <span class="kw4">AI+</span><span class="kw5">АГЕНТ</span><span class="kw6">СУРГАЛТ</span>
      </div>
      <div id="s3" class="scene clip" data-start="7.5" data-duration="3.5" data-track-index="3">
        <div class="big-text">21-Р ЗУУНЫ<br>СУПЕР ХҮН</div>
        <div class="divider s3-d"></div>
        <div class="s3-accent">ТА БОЛОХ УУ?</div>
      </div>
      <div id="s4" class="scene clip" data-start="11" data-duration="4" data-track-index="4">
        <span class="ai-icon">⚡</span>
        <div class="cta-text">ИРЭЭДҮЙГЭЭ<br>ӨӨРЧЛӨӨРЭЙ</div>
        <div class="divider s4-d"></div>
        <div class="s4-accent">89097454<br>aiglobal.mn</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const R = "[data-composition-id=\"main\"]";
      tl.from(R+" .logo-ai",{opacity:0,scale:0.5,rotation:-15,duration:0.8,ease:"back.out(2)"},0.3);
      tl.from(R+" .logo-global",{opacity:0,scale:0.5,rotation:15,duration:0.8,ease:"back.out(2)"},0.5);
      tl.from(R+" .s1-d",{scaleX:0,duration:0.5,ease:"power2.out"},1.2);
      tl.from(R+" .tagline",{opacity:0,y:20,duration:0.6,ease:"power2.out"},1.5);
      tl.from(R+" .kw1",{opacity:0,x:-200,rotation:-30,duration:0.6,ease:"power3.out"},4.2);
      tl.from(R+" .kw2",{opacity:0,y:-150,rotation:20,duration:0.5,ease:"back.out(1.5)"},4.4);
      tl.from(R+" .kw3",{opacity:0,x:200,scale:0,duration:0.6,ease:"elastic.out(1,0.4)"},4.6);
      tl.from(R+" .kw4",{opacity:0,y:150,rotation:-20,duration:0.5,ease:"back.out(1.5)"},5.0);
      tl.from(R+" .kw5",{opacity:0,x:-200,scale:0.3,duration:0.6,ease:"power3.out"},5.2);
      tl.from(R+" .kw6",{opacity:0,y:-100,rotation:15,duration:0.5,ease:"power3.out"},5.5);
      tl.from(R+" #s3 .big-text",{opacity:0,scale:0.3,duration:0.8,ease:"power4.out"},7.8);
      tl.from(R+" .s3-d",{scaleX:0,duration:0.4,ease:"power2.out"},8.5);
      tl.from(R+" .s3-accent",{opacity:0,y:30,duration:0.6,ease:"power2.out"},8.8);
      tl.from(R+" .ai-icon",{opacity:0,scale:0,rotation:-180,duration:0.7,ease:"back.out(2)"},11.3);
      tl.from(R+" .cta-text",{opacity:0,y:40,duration:0.6,ease:"power3.out"},11.8);
      tl.from(R+" .s4-d",{scaleX:0,duration:0.4,ease:"power2.out"},12.3);
      tl.from(R+" .s4-accent",{opacity:0,y:20,duration:0.5,ease:"power2.out"},12.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
