name: hermes-telegram-agent

services:
  hermes-telegram-agent:
    image: ghcr.io/hostinger/hvps-hermes-agent:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
      - mkdir -p /opt/data/logs && uv pip install --python /opt/hermes/.venv/bin/python ddgs >/opt/data/logs/ddgs-install.log 2>&1 && exec /entrypoint.sh
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      HERMES_ACCEPT_HOOKS: "1"
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USER_IDS}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_CONFIRMATION_REQUIRED: ${IMAGE_CONFIRMATION_REQUIRED:-true}
    volumes:
      - ./data:/opt/data:rw
      - ./workspace:/workspace
      - ./runtime-patches/agent/conversation_loop.py:/opt/hermes/agent/conversation_loop.py:ro
      - ./runtime-patches/tools/web_tools.py:/opt/hermes/tools/web_tools.py:ro
