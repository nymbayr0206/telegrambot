<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Photo Tour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh;
  }
  .viewer {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a;
  }
  .viewer img {
    max-width: 100vw; max-height: 85vh; object-fit: contain;
    transition: opacity 0.5s ease, transform 0.5s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .viewer img.fade { opacity: 0; transform: scale(0.98); }
  .viewer img.show { opacity: 1; transform: scale(1); }
  .counter {
    position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 20px;
    font-size: 14px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
  }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease; z-index: 10; backdrop-filter: blur(4px);
  }
  .nav-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-50%) scale(1.1); }
  .prev { left: 20px; } .next { right: 20px; }
  .nav-btn.hidden { opacity: 0; pointer-events: none; }
  .thumbnails {
    position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 10px 20px;
    background: rgba(0,0,0,0.6); border-radius: 12px;
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
    max-width: 90vw; overflow-x: auto;
  }
  .thumbnails::-webkit-scrollbar { height: 3px; }
  .thumbnails::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
  .thumbnail {
    width: 60px; height: 40px; border-radius: 6px; cursor: pointer;
    object-fit: cover; border: 2px solid transparent;
    transition: all 0.3s ease; flex-shrink: 0;
    opacity: 0.5; filter: grayscale(0.5);
  }
  .thumbnail:hover { opacity: 0.8; filter: grayscale(0.2); }
  .thumbnail.active { 
    border-color: #fff; opacity: 1; filter: grayscale(0); 
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
  }
  .controls-hint {
    position: absolute; top: 2%; right: 2%;
    font-size: 12px; color: rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px;
  }
  .title-bar {
    position: absolute; top: 2%; left: 2%;
    font-size: 13px; color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px;
  }
  .fs-btn {
    position: absolute; top: 2%; right: 70px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6); cursor: pointer;
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
    backdrop-filter: blur(4px);
  }
  .fs-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(255,255,255,0.4); font-size: 16px;
  }
  @media (max-width: 768px) {
    .nav-btn { width: 40px; height: 40px; font-size: 18px; }
    .prev { left: 10px; } .next { right: 10px; }
    .thumbnail { width: 45px; height: 30px; }
    .counter { font-size: 12px; padding: 4px 14px; }
  }
</style>
</head>
<body>
<div class="viewer" id="viewer">
  <div class="loading" id="loading">Loading...</div>
  <img id="mainImage" src="" alt="Photo">
  <div class="title-bar">🏠 Property Tour</div>
  <div class="counter" id="counter">1 / {TOTAL}</div>
  <button class="nav-btn prev" id="prevBtn">‹</button>
  <button class="nav-btn next" id="nextBtn">›</button>
  <button class="fs-btn" id="fsBtn">⛶ Fullscreen</button>
  <div class="controls-hint">← → / Click sides</div>
  <div class="thumbnails" id="thumbnails"></div>
</div>

<script>
const TOTAL = {TOTAL};
let current = 1;
const img = document.getElementById('mainImage');
const counter = document.getElementById('counter');
const thumbnails = document.getElementById('thumbnails');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const loading = document.getElementById('loading');
const viewer = document.getElementById('viewer');

function loadImage(n) {
  const src = `photo_${String(n).padStart(2, '0')}.jpg`;
  loading.style.display = 'block';
  img.classList.remove('show');
  img.classList.add('fade');
  const newImg = new Image();
  newImg.onload = () => {
    img.src = src;
    img.classList.remove('fade');
    img.classList.add('show');
    loading.style.display = 'none';
    counter.textContent = `${n} / ${TOTAL}`;
    current = n;
    updateNav();
    updateThumbs();
  };
  newImg.src = src;
}
function updateNav() {
  prevBtn.classList.toggle('hidden', current === 1);
  nextBtn.classList.toggle('hidden', current === TOTAL);
}
function prev() { if (current > 1) loadImage(current - 1); }
function next() { if (current < TOTAL) loadImage(current + 1); }
function buildThumbs() {
  for (let i = 1; i <= TOTAL; i++) {
    const t = document.createElement('img');
    t.className = 'thumbnail';
    t.src = `photo_${String(i).padStart(2, '0')}.jpg`;
    t.onclick = () => loadImage(i);
    thumbnails.appendChild(t);
  }
}
function updateThumbs() {
  document.querySelectorAll('.thumbnail').forEach((t, i) => {
    t.classList.toggle('active', i + 1 === current);
    if (i + 1 === current) t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}
viewer.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') {
    const rect = viewer.getBoundingClientRect();
    if (e.clientX - rect.left < rect.width / 2) prev();
    else next();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
});
document.getElementById('fsBtn').onclick = () => {
  if (!document.fullscreenElement) viewer.requestFullscreen?.();
  else document.exitFullscreen();
};
let touchX = 0;
viewer.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; });
viewer.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].clientX - touchX;
  if (Math.abs(diff) > 50) diff > 0 ? prev() : next();
});
buildThumbs();
loadImage(1);
</script>
</body>
</html>
